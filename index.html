<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b5a">
  <meta name="description" content="本地保存、快速搜索的配方记录助手">
  <link rel="manifest" href="manifest.json">
  <title>配方助手</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2d2a;
      --muted: #687672;
      --line: #dbe5e0;
      --paper: #ffffff;
      --canvas: #f2f7f4;
      --green: #176b5a;
      --green-dark: #0d5143;
      --green-soft: #e6f3ed;
      --orange: #e67b35;
      --danger: #b73939;
      --shadow: 0 14px 35px rgba(21, 58, 48, .10);
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(230, 123, 53, .42);
      outline-offset: 2px;
    }
    .app-shell {
      width: 100%;
      max-width: 720px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .topbar {
      padding: max(20px, env(safe-area-inset-top)) 20px 17px;
      color: #fff;
      background: linear-gradient(135deg, var(--green-dark), var(--green));
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 12px;
      color: #f7ceac;
      background: rgba(255,255,255,.10);
      font-size: 20px;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: .04em; }
    .subhead { margin: 3px 0 0; color: rgba(255,255,255,.75); font-size: 12px; }
    .record-count {
      min-width: 64px;
      padding: 7px 9px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,.12);
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
    }
    .main { padding: 18px 16px calc(102px + env(safe-area-inset-bottom)); }
    .view { display: none; }
    .view.is-active { display: block; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h2 { margin: 0; font-size: 18px; font-weight: 700; }
    .hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .search-wrap { position: relative; margin: 4px 0 16px; }
    .search-wrap::before { content: "⌕"; position: absolute; top: 50%; left: 14px; transform: translateY(-53%); color: var(--muted); font-size: 24px; pointer-events: none; }
    .search-input {
      width: 100%;
      min-height: 50px;
      padding: 12px 42px 12px 43px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: #fbfdfc;
      font-size: 16px;
    }
    .search-input::placeholder { color: #9aa6a1; }
    .clear-search {
      position: absolute;
      top: 50%; right: 8px;
      display: none;
      width: 34px; height: 34px;
      transform: translateY(-50%);
      border: 0; border-radius: 50%;
      color: var(--muted); background: transparent;
      font-size: 22px; line-height: 1;
    }
    .clear-search.is-visible { display: block; }
    .recipe-list { display: grid; gap: 11px; }
    .recipe-row {
      display: grid;
      grid-template-columns: minmax(92px, 29fr) minmax(0, 71fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--paper);
      box-shadow: 0 2px 7px rgba(24, 57, 48, .035);
    }
    .recipe-name {
      display: flex;
      align-items: flex-start;
      min-width: 0;
      padding: 15px 11px 13px;
      border: 0;
      border-right: 1px solid var(--line);
      color: var(--green-dark);
      background: var(--green-soft);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
      text-align: left;
      word-break: break-word;
    }
    .recipe-name:hover { background: #d9eee5; }
    .recipe-detail { min-width: 0; padding: 13px 13px 11px; }
    .recipe-copy { margin: 0; color: #34443f; font-size: 14px; line-height: 1.62; white-space: pre-wrap; word-break: break-word; }
    .recipe-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 9px; }
    .tags { display: flex; flex: 1; flex-wrap: wrap; gap: 5px; min-width: 0; }
    .tag {
      max-width: 100%;
      padding: 3px 7px;
      overflow: hidden;
      border-radius: 999px;
      color: var(--green-dark);
      background: var(--green-soft);
      font-size: 11px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .row-actions { display: flex; flex: none; gap: 4px; }
    .icon-button {
      display: grid;
      width: 34px; height: 34px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      font-size: 16px;
    }
    .icon-button:hover { color: var(--green-dark); background: var(--green-soft); }
    .icon-button.delete:hover { color: var(--danger); background: #fdecec; }
    mark { padding: 0 1px; border-radius: 3px; color: inherit; background: #ffe3ad; }
    .empty-state {
      display: grid;
      min-height: 230px;
      place-items: center;
      padding: 25px;
      border: 1px dashed #c7d7d0;
      border-radius: 16px;
      color: var(--muted);
      background: #fbfdfc;
      text-align: center;
    }
    .empty-icon { margin-bottom: 8px; color: var(--orange); font-size: 34px; }
    .empty-state h3 { margin: 0 0 7px; color: var(--ink); font-size: 16px; }
    .empty-state p { max-width: 270px; margin: 0 auto 16px; font-size: 13px; line-height: 1.6; }
    .button {
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 650;
    }
    .button.primary { color: #fff; background: var(--green); }
    .button.primary:hover { background: var(--green-dark); }
    .button.secondary { border-color: var(--line); color: var(--green-dark); background: #fff; }
    .button.secondary:hover { background: var(--green-soft); }
    .button.danger { color: var(--danger); border-color: #f0c5c5; background: #fff; }
    .search-summary { min-height: 20px; margin: -5px 0 12px; color: var(--muted); font-size: 13px; }
    .search-summary strong { color: var(--green-dark); }
    .bottom-nav {
      position: fixed;
      right: 0; bottom: 0; left: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom);
      pointer-events: none;
    }
    .nav-inner {
      display: flex;
      width: min(720px, 100%);
      min-height: 67px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      box-shadow: 0 -8px 20px rgba(23, 54, 45, .06);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    .nav-button {
      flex: 1;
      min-height: 64px;
      padding: 8px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
    }
    .nav-button span { display: block; margin-bottom: 1px; font-size: 21px; line-height: 23px; }
    .nav-button.is-active { color: var(--green-dark); font-weight: 700; }
    .add-button {
      position: fixed;
      right: max(18px, calc((100% - 720px) / 2 + 18px));
      bottom: calc(78px + env(safe-area-inset-bottom));
      z-index: 6;
      display: grid;
      width: 53px; height: 53px;
      place-items: center;
      border: 0;
      border-radius: 17px;
      color: #fff;
      background: var(--orange);
      box-shadow: 0 9px 18px rgba(192, 88, 24, .27);
      font-size: 29px;
      line-height: 1;
    }
    .add-button:hover { background: #cc6428; transform: translateY(-1px); }
    dialog {
      width: min(560px, calc(100% - 26px));
      max-height: min(720px, calc(100dvh - 32px));
      padding: 0;
      border: 0;
      border-radius: 20px;
      color: var(--ink);
      box-shadow: 0 20px 70px rgba(13, 40, 33, .28);
    }
    dialog::backdrop { background: rgba(12, 36, 29, .48); backdrop-filter: blur(2px); }
    .dialog-form { display: flex; max-height: inherit; flex-direction: column; }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 19px 19px 15px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { font-size: 18px; }
    .dialog-body { display: grid; gap: 16px; padding: 18px 19px; overflow: auto; }
    .field { display: grid; gap: 7px; }
    label { color: #3a4b45; font-size: 14px; font-weight: 650; }
    label em { color: var(--muted); font-size: 12px; font-style: normal; font-weight: 400; }
    .field-input {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid #cbdad3;
      border-radius: 11px;
      color: var(--ink);
      background: #fff;
      font-size: 16px;
    }
    textarea.field-input { min-height: 172px; resize: vertical; line-height: 1.6; }
    .field-help { margin: -2px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .form-error { min-height: 18px; margin: -4px 0 0; color: var(--danger); font-size: 13px; }
    .dialog-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 19px 18px; border-top: 1px solid var(--line); }
    .toast {
      position: fixed;
      bottom: calc(86px + env(safe-area-inset-bottom));
      left: 50%; z-index: 12;
      max-width: calc(100% - 40px);
      padding: 10px 15px;
      transform: translate(-50%, 20px);
      border-radius: 999px;
      color: #fff;
      background: #243a34;
      box-shadow: 0 8px 23px rgba(0,0,0,.18);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    @media (min-width: 721px) {
      body { padding: 16px 0; }
      .app-shell { min-height: calc(100dvh - 32px); border-radius: 22px; overflow: hidden; }
      .bottom-nav { bottom: 16px; }
      .nav-inner { border-radius: 0 0 22px 22px; }
    }
    @media (max-width: 375px) {
      .main { padding-right: 12px; padding-left: 12px; }
      .topbar { padding-right: 15px; padding-left: 15px; }
      .recipe-row { grid-template-columns: minmax(83px, 28fr) minmax(0, 72fr); }
      .recipe-name { padding: 13px 9px; font-size: 14px; }
      .recipe-detail { padding: 12px 10px 9px; }
      .recipe-copy { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">♨</div>
          <div>
            <h1>配方助手</h1>
            <p class="subhead">记录灵感，随时找到它</p>
          </div>
        </div>
        <div class="record-count" id="recordCount" aria-live="polite">0 条配方</div>
      </div>
    </header>

    <main class="main">
      <section class="view is-active" id="recordsView" aria-labelledby="recordsHeading">
        <div class="section-head">
          <div>
            <h2 id="recordsHeading">我的配方</h2>
            <p class="hint">左侧名称，右侧记录具体配方</p>
          </div>
        </div>
        <div class="recipe-list" id="recordsList" aria-live="polite"></div>
      </section>

      <section class="view" id="searchView" aria-labelledby="searchHeading">
        <div class="section-head">
          <div>
            <h2 id="searchHeading">搜索配方</h2>
            <p class="hint">名称、配方内容、标签都能找到</p>
          </div>
        </div>
        <div class="search-wrap">
          <input class="search-input" id="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="输入关键词，如：番茄、低糖、空气炸锅">
          <button class="clear-search" id="clearSearch" type="button" aria-label="清空搜索">×</button>
        </div>
        <p class="search-summary" id="searchSummary" aria-live="polite">输入关键词，显示相关配方</p>
        <div class="recipe-list" id="searchList"></div>
      </section>
    </main>
  </div>

  <button class="add-button" id="addButton" type="button" aria-label="新增配方" title="新增配方">+</button>
  <nav class="bottom-nav" aria-label="主导航">
    <div class="nav-inner">
      <button class="nav-button is-active" type="button" data-view="records" aria-current="page"><span aria-hidden="true">▤</span>记录</button>
      <button class="nav-button" type="button" data-view="search"><span aria-hidden="true">⌕</span>搜索</button>
    </div>
  </nav>

  <dialog id="recipeDialog" aria-labelledby="dialogTitle">
    <form class="dialog-form" id="recipeForm" method="dialog" novalidate>
      <div class="dialog-head">
        <h2 id="dialogTitle">新增配方</h2>
        <button class="icon-button" id="closeDialog" type="button" aria-label="关闭">×</button>
      </div>
      <div class="dialog-body">
        <div class="field">
          <label for="recipeName">配方名字</label>
          <input class="field-input" id="recipeName" name="name" maxlength="40" placeholder="例如：番茄牛腩" required>
        </div>
        <div class="field">
          <label for="recipeContent">具体配方</label>
          <textarea class="field-input" id="recipeContent" name="content" maxlength="2000" placeholder="食材、用量、步骤、火候、注意事项……" required></textarea>
          <p class="field-help">支持分行记录，方便写食材和步骤。</p>
        </div>
        <div class="field">
          <label for="recipeTags">标签 <em>（可选，用空格或逗号分隔）</em></label>
          <input class="field-input" id="recipeTags" name="tags" maxlength="100" placeholder="例如：家常菜 晚餐 低脂">
        </div>
        <p class="form-error" id="formError" role="alert"></p>
      </div>
      <div class="dialog-foot">
        <button class="button secondary" id="cancelDialog" type="button">取消</button>
        <button class="button primary" type="submit">保存配方</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'recipe-assistant.records.v1';
      const state = { recipes: loadRecipes(), activeView: 'records', editingId: null };
      const el = {
        recordCount: document.getElementById('recordCount'),
        recordsList: document.getElementById('recordsList'),
        searchList: document.getElementById('searchList'),
        searchInput: document.getElementById('searchInput'),
        clearSearch: document.getElementById('clearSearch'),
        searchSummary: document.getElementById('searchSummary'),
        dialog: document.getElementById('recipeDialog'),
        form: document.getElementById('recipeForm'),
        dialogTitle: document.getElementById('dialogTitle'),
        name: document.getElementById('recipeName'),
        content: document.getElementById('recipeContent'),
        tags: document.getElementById('recipeTags'),
        formError: document.getElementById('formError'),
        toast: document.getElementById('toast')
      };
      let toastTimer;

      function loadRecipes() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!Array.isArray(saved)) return [];
          return saved.filter(isValidRecipe).sort(sortNewest);
        } catch (_) {
          return [];
        }
      }

      function isValidRecipe(item) {
        return item && typeof item.id === 'string' && typeof item.name === 'string' && typeof item.content === 'string';
      }

      function sortNewest(a, b) {
        return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
      }

      function saveRecipes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.recipes));
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
      }

      function escapeRegExp(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function highlight(value, query) {
        const safe = escapeHtml(value);
        const keywords = query.trim().split(/\s+/).filter(Boolean).sort((a, b) => b.length - a.length);
        if (!keywords.length) return safe;
        const expression = new RegExp(`(${keywords.map(escapeRegExp).join('|')})`, 'gi');
        return safe.replace(expression, '<mark>$1</mark>');
      }

      function normalizeTags(value) {
        return [...new Set(value.split(/[\s,，、]+/).map(tag => tag.trim()).filter(Boolean))].slice(0, 8);
      }

      function recipeTags(recipe) {
        return Array.isArray(recipe.tags) ? recipe.tags : normalizeTags(String(recipe.tags || ''));
      }

      function matches(recipe, query) {
        const text = `${recipe.name} ${recipe.content} ${recipeTags(recipe).join(' ')}`.toLocaleLowerCase();
        return query.trim().split(/\s+/).filter(Boolean).every(term => text.includes(term.toLocaleLowerCase()));
      }

      function recipeRow(recipe, query = '') {
        const tags = recipeTags(recipe);
        const tagsHtml = tags.map(tag => `<span class="tag">${highlight(tag, query)}</span>`).join('');
        return `
          <article class="recipe-row" data-id="${escapeHtml(recipe.id)}">
            <button class="recipe-name" type="button" data-action="edit" data-id="${escapeHtml(recipe.id)}" aria-label="编辑 ${escapeHtml(recipe.name)}">${highlight(recipe.name, query)}</button>
            <div class="recipe-detail">
              <p class="recipe-copy">${highlight(recipe.content, query)}</p>
              <div class="recipe-meta">
                <div class="tags">${tagsHtml}</div>
                <div class="row-actions">
                  <button class="icon-button" type="button" data-action="edit" data-id="${escapeHtml(recipe.id)}" aria-label="编辑 ${escapeHtml(recipe.name)}">✎</button>
                  <button class="icon-button delete" type="button" data-action="delete" data-id="${escapeHtml(recipe.id)}" aria-label="删除 ${escapeHtml(recipe.name)}">⌫</button>
                </div>
              </div>
            </div>
          </article>`;
      }

      function emptyState(kind) {
        if (kind === 'search') {
          return `<div class="empty-state"><div><div class="empty-icon" aria-hidden="true">⌕</div><h3>没有找到相关配方</h3><p>换个关键词，或先新增一条配方记录。</p><button class="button secondary" type="button" data-action="clear-search">清空搜索</button></div></div>`;
        }
        return `<div class="empty-state"><div><div class="empty-icon" aria-hidden="true">♨</div><h3>还没有配方记录</h3><p>点击下方加号，写下第一个配方；名称会显示在左侧，详细配方显示在右侧。</p><button class="button primary" type="button" data-action="new">新增第一条配方</button></div></div>`;
      }

      function renderRecords() {
        el.recordCount.textContent = `${state.recipes.length} 条配方`;
        el.recordsList.innerHTML = state.recipes.length
          ? state.recipes.map(recipe => recipeRow(recipe)).join('')
          : emptyState('records');
      }

      function renderSearch() {
        const query = el.searchInput.value.trim();
        el.clearSearch.classList.toggle('is-visible', Boolean(query));
        if (!query) {
          el.searchSummary.innerHTML = '输入关键词，显示相关配方';
          el.searchList.innerHTML = state.recipes.length ? state.recipes.map(recipe => recipeRow(recipe)).join('') : emptyState('records');
          return;
        }
        const results = state.recipes.filter(recipe => matches(recipe, query));
        el.searchSummary.innerHTML = `找到 <strong>${results.length}</strong> 条与“${escapeHtml(query)}”相关的配方`;
        el.searchList.innerHTML = results.length ? results.map(recipe => recipeRow(recipe, query)).join('') : emptyState('search');
      }

      function render() {
        renderRecords();
        renderSearch();
      }

      function showView(view) {
        state.activeView = view;
        document.getElementById('recordsView').classList.toggle('is-active', view === 'records');
        document.getElementById('searchView').classList.toggle('is-active', view === 'search');
        document.querySelectorAll('.nav-button').forEach(button => {
          const active = button.dataset.view === view;
          button.classList.toggle('is-active', active);
          button.toggleAttribute('aria-current', active);
        });
        if (view === 'search') setTimeout(() => el.searchInput.focus(), 0);
      }

      function openDialog(recipe = null) {
        state.editingId = recipe ? recipe.id : null;
        el.dialogTitle.textContent = recipe ? '编辑配方' : '新增配方';
        el.name.value = recipe ? recipe.name : '';
        el.content.value = recipe ? recipe.content : '';
        el.tags.value = recipe ? recipeTags(recipe).join(' ') : '';
        el.formError.textContent = '';
        if (!el.dialog.open) el.dialog.showModal();
        setTimeout(() => el.name.focus(), 0);
      }

      function closeDialog() {
        if (el.dialog.open) el.dialog.close();
        state.editingId = null;
      }

      function newId() {
        return window.crypto && crypto.randomUUID ? crypto.randomUUID() : `recipe-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function saveForm() {
        const name = el.name.value.trim();
        const content = el.content.value.trim();
        if (!name || !content) {
          el.formError.textContent = '请填写配方名字和具体配方。';
          (!name ? el.name : el.content).focus();
          return;
        }
        const now = new Date().toISOString();
        const existingIndex = state.recipes.findIndex(recipe => recipe.id === state.editingId);
        if (existingIndex > -1) {
          state.recipes[existingIndex] = { ...state.recipes[existingIndex], name, content, tags: normalizeTags(el.tags.value), updatedAt: now };
          showToast('配方已更新');
        } else {
          state.recipes.unshift({ id: newId(), name, content, tags: normalizeTags(el.tags.value), createdAt: now, updatedAt: now });
          showToast('配方已保存');
        }
        state.recipes.sort(sortNewest);
        saveRecipes();
        render();
        closeDialog();
      }

      function editRecipe(id) {
        const recipe = state.recipes.find(item => item.id === id);
        if (recipe) openDialog(recipe);
      }

      function deleteRecipe(id) {
        const recipe = state.recipes.find(item => item.id === id);
        if (!recipe) return;
        if (!window.confirm(`删除“${recipe.name}”？此操作无法撤销。`)) return;
        state.recipes = state.recipes.filter(item => item.id !== id);
        saveRecipes();
        render();
        showToast('配方已删除');
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        el.toast.textContent = message;
        el.toast.classList.add('show');
        toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1800);
      }

      document.querySelectorAll('.nav-button').forEach(button => button.addEventListener('click', () => showView(button.dataset.view)));
      document.getElementById('addButton').addEventListener('click', () => openDialog());
      document.getElementById('closeDialog').addEventListener('click', closeDialog);
      document.getElementById('cancelDialog').addEventListener('click', closeDialog);
      el.form.addEventListener('submit', event => { event.preventDefault(); saveForm(); });
      el.searchInput.addEventListener('input', renderSearch);
      el.clearSearch.addEventListener('click', () => { el.searchInput.value = ''; renderSearch(); el.searchInput.focus(); });
      document.addEventListener('click', event => {
        const action = event.target.closest('[data-action]');
        if (!action) return;
        if (action.dataset.action === 'new') openDialog();
        if (action.dataset.action === 'edit') editRecipe(action.dataset.id);
        if (action.dataset.action === 'delete') deleteRecipe(action.dataset.id);
        if (action.dataset.action === 'clear-search') { el.searchInput.value = ''; renderSearch(); el.searchInput.focus(); }
      });
      el.dialog.addEventListener('close', () => { el.formError.textContent = ''; });

      render();
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    })();
  </script>
</body>
</html>
